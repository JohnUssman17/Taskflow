<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow - Minimal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#0a0a0a;color:white;min-height:100vh;display:flex;justify-content:center;padding:40px 15px}
.container{width:100%;max-width:480px}
h1{font-size:42px;font-weight:800;letter-spacing:-1px;margin-bottom:8px}h1 span{color:#a3ff12}
.sub{color:#777;font-size:14px;margin-bottom:28px}
.input-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:6px;display:flex;gap:6px;margin-bottom:24px}
.input-box input{flex:1;background:transparent;border:none;outline:none;color:white;padding:12px 16px;font-size:16px}
.input-box button{background:#a3ff12;color:black;border:none;border-radius:12px;padding:12px 22px;font-weight:700;cursor:pointer}
#list{list-style:none;display:flex;flex-direction:column;gap:10px}
.task{background:#141414;border:1px solid #222;border-radius:14px;padding:14px 18px;display:flex;align-items:center;gap:12px}
.task.done{opacity:0.5}.task.done .task-text{text-decoration:line-through;color:#555}
.check{width:22px;height:22px;border-radius:6px;border:2px solid #333;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:0.2s}
.check.checked{background:#a3ff12;border-color:#a3ff12;color:black}
.task-text{flex:1;font-size:15px;color:#e5e5e5;font-weight:500}
.del{background:#222;border:none;color:#666;width:32px;height:32px;border-radius:8px;cursor:pointer}
.del:hover{background:#ff2d2d;color:white}
.count{font-size:12px;color:#444;margin-top:16px;text-transform:uppercase;letter-spacing:1px}
.empty{text-align:center;color:#333;margin-top:60px;font-size:14px}
</style></head><body>
<div class="container">
<h1>Task<span>.</span>Flow</h1><p class="sub">Your day, organized.</p>
<div class="input-box"><input id="taskInput" placeholder="What needs to be done?"><button onclick="addTask()">Add</button></div>
<ul id="list"></ul><p class="count" id="count"></p>
</div>
<script>
const api='/tasks';
const listEl=document.getElementById('list');
const inputEl=document.getElementById('taskInput');
async function load(){
  const tasks=await (await fetch(api)).json();
  listEl.innerHTML='';
  if(!tasks.length){listEl.innerHTML='<div class="empty">No tasks yet. Add one above 👆</div>';document.getElementById('count').innerText='';return;}
  // FIFO - NO REVERSE
  tasks.forEach(t=>{
    const li=document.createElement('li');
    li.className='task'+(t.completed?' done':'');
    li.innerHTML=`<button class="check ${t.completed?'checked':''}" onclick="toggleTask(${t.id})">${t.completed?'✓':''}</button><span class="task-text">${t.title}</span><button class="del" onclick="delTask(${t.id})">✕</button>`;
    listEl.appendChild(li);
  });
  document.getElementById('count').innerText=`${tasks.filter(t=>!t.completed).length} remaining / ${tasks.length} total`;
}
async function addTask(){
  const title=inputEl.value.trim(); if(!title) return;
  await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});
  inputEl.value=''; load();
}
async function toggleTask(id){ await fetch(`${api}/${id}`,{method:'PUT'}); load(); }
async function delTask(id){ await fetch(`${api}/${id}`,{method:'DELETE'}); load(); }
inputEl.addEventListener('keypress',e=>{if(e.key==='Enter') addTask()});
load();
</script></body></html>
